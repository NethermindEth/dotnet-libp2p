name: Transport performance comparison

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: transport-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    if: contains(github.event.pull_request.labels.*.name, 'performance is good')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [tcp-noise-yamux, tcp-tls-yamux, quic-v1]
    steps:
      - name: Check out main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out pull request revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: base/global.json

      - name: Use the same benchmark for both revisions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d base/libp2p/Libp2p.Transport.Benchmarks ]; then
            source=base
          else
            source=head
          fi
          cp -a "$source/libp2p/Libp2p.Transport.Benchmarks" "$RUNNER_TEMP/transport-harness"
          for revision in base head; do
            rm -rf -- "$revision/libp2p/Libp2p.Transport.Benchmarks"
            cp -a "$RUNNER_TEMP/transport-harness" "$revision/libp2p/Libp2p.Transport.Benchmarks"
          done

      - name: Build both revisions
        shell: bash
        run: |
          set -euo pipefail
          for revision in base head; do
            (cd "$revision" && dotnet build libp2p/Libp2p.Transport.Benchmarks/Libp2p.Transport.Benchmarks.csproj \
              -c Release -p:SaveDiskSpace=true -warnaserror)
          done

      - name: Measure both revisions
        shell: bash
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          mkdir -p results
          for metric in upload download latency; do
            for sample in 1 2 3 4 5; do
              for revision in base head; do
                if ! (cd "$revision" && timeout 15s dotnet run --no-build \
                    --project libp2p/Libp2p.Transport.Benchmarks/Libp2p.Transport.Benchmarks.csproj \
                    -c Release -- "$GITHUB_WORKSPACE/results/$STACK-$revision-$metric-$sample.json" "$STACK" "$metric"); then
                  echo "::warning::Benchmark did not complete: $STACK $revision $metric sample $sample"
                fi
              done
            done
          done

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.stack }}
          path: results/*.json
          if-no-files-found: ignore
          retention-days: 7
