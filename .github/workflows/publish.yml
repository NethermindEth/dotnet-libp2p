name: Publish
# cspell:ignore pipefail

on:
  workflow_dispatch:
    inputs:
      feed:
        description: NuGet feed
        required: true
        default: Staging
        type: choice
        options:
          - Production
          - Staging
      version:
        description: Library version
        required: true
        default: 1.0.0
        type: string

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_CONFIG: Release
      NUGET_URL: ${{ inputs.feed == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.feed == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json
      WORKING_DIR: libp2p
    steps:

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: List test projects
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet sln Libp2p.slnx list |
            awk 'NR > 2 && NF' |
            grep -E '\.(Tests|E2eTests)\.csproj$' > "$RUNNER_TEMP/publish-test-projects.txt"
          test -s "$RUNNER_TEMP/publish-test-projects.txt"
          cat "$RUNNER_TEMP/publish-test-projects.txt"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: dotnet build -c ${{ env.BUILD_CONFIG }} --no-restore -p:Version=${{ inputs.version }}

      - name: Test
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet test "$project" -c "$BUILD_CONFIG" --no-build -- --minimum-expected-tests 1
          done < "$RUNNER_TEMP/publish-test-projects.txt"

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PACK_OPTS: -c ${{ env.BUILD_CONFIG }} --no-build -p:Version=${{ inputs.version }}
          NO_VERSION_PACK_OPTS: -c ${{ env.BUILD_CONFIG }} --no-build
        run: |
          dotnet pack Libp2p ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Core ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.OpenTelemetry ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Generators.Protobuf ${{ env.NO_VERSION_PACK_OPTS }}
          dotnet pack Libp2p.Protocols.AutoTls ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Identify ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.IpTcp ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.KadDht ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.MDns ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Mplex ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Multistream ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Noise ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Ping ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Plaintext ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Pubsub ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.PubsubPeerDiscovery ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.RequestResponse ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Quic ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Relay ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Tls ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.WebRtc ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.WebSockets ${{ env.PACK_OPTS }}
          dotnet pack Libp2p.Protocols.Yamux ${{ env.PACK_OPTS }}

          dotnet nuget push **/*.nupkg --skip-duplicate \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}
