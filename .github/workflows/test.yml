# cspell:words GOCACHE GOMODCACHE
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: release
      WORKING_DIR: libp2p
    steps:

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: List test projects
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
          python3 ../.github/scripts/discover_test_projects.py > "$RUNNER_TEMP/test-projects.txt"
          cat "$RUNNER_TEMP/test-projects.txt"

      - name: List CI projects
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          dotnet sln Libp2p.slnx list |
            awk 'NR > 2 && NF' |
            grep -Eiv 'samples[/\\]maui-chat[/\\]MauiChat\.csproj' > "$RUNNER_TEMP/ci-projects.txt"
          cat "$RUNNER_TEMP/ci-projects.txt"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < "$RUNNER_TEMP/ci-projects.txt"

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          while IFS= read -r project; do
            dotnet build "$project" -c ${{ env.BUILD_CONFIG }} --no-restore
          done < "$RUNNER_TEMP/ci-projects.txt"

      - name: Test
        timeout-minutes: 30
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash ../.github/scripts/run_test_projects.sh "$RUNNER_TEMP/test-projects.txt"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Require TLS certificate-list and lifecycle controls
        working-directory: ${{ env.WORKING_DIR }}
        run: >-
          dotnet test Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj
          -c ${{ env.BUILD_CONFIG }} --no-build --
          --minimum-expected-tests 79

      - name: Require WebRTC fingerprint enforcement controls
        working-directory: ${{ env.WORKING_DIR }}
        run: >-
          dotnet test Libp2p.Protocols.WebRtc.Tests/Libp2p.Protocols.WebRtc.Tests.csproj
          -c ${{ env.BUILD_CONFIG }} --no-build --
          --filter "FullyQualifiedName~WebRtcDirectFingerprintEnforcementTests"
          --minimum-expected-tests 6

  tls-evidence-and-interop:
    name: TLS evidence and pinned Go interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOCACHE: ${{ runner.temp }}/go-build
      GOMODCACHE: ${{ runner.temp }}/go-mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check historical evidence integrity and report source drift
        run: >-
          python3 .github/scripts/check_tls_evidence.py
          --output "$RUNNER_TEMP/tls-interop/evidence.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false

      - name: Install interoperability service
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Build pinned Go peer and run reference tests
        working-directory: tests/tls-interop
        run: |
          set -euo pipefail
          go build -mod=readonly -o "$RUNNER_TEMP/tls-go-peer" .
          go test -mod=readonly github.com/libp2p/go-libp2p/p2p/security/tls -run 'TestNewIdentityCertificates|TestVectors' -count=1 -v > "$RUNNER_TEMP/tls-interop/go-reference.log" 2>&1
          cat "$RUNNER_TEMP/tls-interop/go-reference.log"
          grep -q '^--- PASS: TestNewIdentityCertificates' "$RUNNER_TEMP/tls-interop/go-reference.log"
          grep -q '^--- PASS: TestVectors' "$RUNNER_TEMP/tls-interop/go-reference.log"

      - name: Build production transport interoperability sample
        run: dotnet build samples/transport-interop/TransportInterop.csproj -c Release --artifacts-path "$RUNNER_TEMP/a" -p:TreatWarningsAsErrors=true

      - name: Run Go and .NET TLS and Yamux in both roles
        run: >-
          python3 tests/tls-interop/run.py
          --dotnet-dll "$RUNNER_TEMP/a/bin/TransportInterop/release/TransportInterop.dll"
          --go-peer "$RUNNER_TEMP/tls-go-peer"
          --output "$RUNNER_TEMP/tls-interop/peers"

      - name: Upload evidence drift and interoperability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-evidence-and-interop
          path: ${{ runner.temp }}/tls-interop
          if-no-files-found: error

  windows-quic-tls:
    name: Windows QUIC and TLS
    runs-on: windows-latest
    defaults:
      run:
        working-directory: libp2p
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Build QUIC tests
        run: dotnet build Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Build TLS tests
        run: dotnet build Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Record Windows runtime and certificate probe output
        run: |
          dotnet --info
          "<RunSettings><NUnit><TestOutputXml>$env:RUNNER_TEMP/secure-transport-results</TestOutputXml></NUnit></RunSettings>" | Set-Content "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Test QUIC
        run: dotnet test Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj -c Release --no-build -- --minimum-expected-tests 32 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Test TLS
        run: dotnet test Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj -c Release --no-build -- --minimum-expected-tests 79 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Build registered transport tests
        run: dotnet build Libp2p.E2eTests/Libp2p.E2eTests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Test registered transport lifetime and parent identity guarantees
        run: dotnet test Libp2p.E2eTests/Libp2p.E2eTests.csproj -c Release --no-build -- --filter "FullyQualifiedName~RegisteredSecureTransportTests|FullyQualifiedName~RegisteredSecurityRejectsAnAliasExpectedPeerId|FullyQualifiedName~TlsCertificateListTests" --minimum-expected-tests 36 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Upload certificate probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-secure-transport-results
          path: ${{ runner.temp }}/secure-transport-results
          if-no-files-found: warn
