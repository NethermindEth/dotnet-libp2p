name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: release
      WORKING_DIR: libp2p
    steps:

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: List CI projects
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          dotnet sln Libp2p.slnx list |
            awk 'NR > 2 && NF' |
            grep -Eiv 'samples[/\\]maui-chat[/\\]MauiChat\.csproj' > "$RUNNER_TEMP/ci-projects.txt"
          cat "$RUNNER_TEMP/ci-projects.txt"

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < "$RUNNER_TEMP/ci-projects.txt"

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          while IFS= read -r project; do
            dotnet build "$project" -c ${{ env.BUILD_CONFIG }} --no-restore
          done < "$RUNNER_TEMP/ci-projects.txt"

      - name: Test
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TEST_OPTS: -c ${{ env.BUILD_CONFIG }} --no-build -- --minimum-expected-tests 1
        run: |
          dotnet test Libp2p.Core.Tests/Libp2p.Core.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.AutoTls.Tests/Libp2p.Protocols.AutoTls.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.IpTcp.Tests/Libp2p.Protocols.IpTcp.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.KadDht.Tests/Libp2p.Protocols.KadDht.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Mplex.Tests/Libp2p.Protocols.Mplex.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Multistream.Tests/Libp2p.Protocols.Multistream.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Noise.Tests/Libp2p.Protocols.Noise.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Ping.Tests/Libp2p.Protocols.Ping.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Plaintext.Tests/Libp2p.Protocols.Plaintext.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Pubsub.Tests/Libp2p.Protocols.Pubsub.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.RequestResponse.Tests/Libp2p.Protocols.RequestResponse.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.WebRtc.Tests/Libp2p.Protocols.WebRtc.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.WebSockets.Tests/Libp2p.Protocols.WebSockets.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Yamux.Tests/Libp2p.Protocols.Yamux.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Samples.Perf.Tests/Libp2p.Samples.Perf.Tests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.E2eTests/Libp2p.E2eTests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.Pubsub.E2eTests/Libp2p.Protocols.Pubsub.E2eTests.csproj ${{ env.TEST_OPTS }}
          dotnet test Libp2p.Protocols.PubsubPeerDiscovery.E2eTests/Libp2p.Protocols.PubsubPeerDiscovery.E2eTests.csproj ${{ env.TEST_OPTS }}

  windows-quic-tls:
    name: Windows QUIC and TLS
    runs-on: windows-latest
    defaults:
      run:
        working-directory: libp2p
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Build QUIC tests
        run: dotnet build Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Build TLS tests
        run: dotnet build Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Record Windows runtime and certificate probe output
        run: |
          dotnet --info
          "<RunSettings><NUnit><TestOutputXml>$env:RUNNER_TEMP/secure-transport-results</TestOutputXml></NUnit></RunSettings>" | Set-Content "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Test QUIC
        run: dotnet test Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj -c Release --no-build -- --minimum-expected-tests 32

      - name: Test Windows process-key creation and recovery
        run: dotnet test Libp2p.Protocols.Quic.Tests/Libp2p.Protocols.Quic.Tests.csproj -c Release --no-build -- --filter "FullyQualifiedName~WindowsProcessKeyRecoveryTests&FullyQualifiedName!~ChildProcess" --minimum-expected-tests 20 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Test TLS
        run: dotnet test Libp2p.Protocols.Tls.Tests/Libp2p.Protocols.Tls.Tests.csproj -c Release --no-build -- --minimum-expected-tests 32 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Build registered transport tests
        run: dotnet build Libp2p.E2eTests/Libp2p.E2eTests.csproj -c Release -p:SaveDiskSpace=true -p:TreatWarningsAsErrors=true

      - name: Test registered transport lifetime and parent identity guarantees
        run: dotnet test Libp2p.E2eTests/Libp2p.E2eTests.csproj -c Release --no-build -- --filter "FullyQualifiedName~RegisteredSecureTransportTests|FullyQualifiedName~RegisteredSecurityRejectsAnAliasExpectedPeerId" --minimum-expected-tests 5

      - name: Test registered Windows crash recovery with a live peer
        run: dotnet test Libp2p.E2eTests/Libp2p.E2eTests.csproj -c Release --no-build -- --filter "FullyQualifiedName~RegisteredWindowsKeyRecoveryTests&FullyQualifiedName!~ChildListener" --minimum-expected-tests 2 --settings "$env:RUNNER_TEMP/secure-transports.xml"

      - name: Upload certificate probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-secure-transport-results
          path: ${{ runner.temp }}/secure-transport-results
          if-no-files-found: warn
