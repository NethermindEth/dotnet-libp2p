name: bench-core-identity

on:
  push:
    branches: [bench/core-identity-1114]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
      - name: Runner CPU
        run: lscpu; nproc; free -g
      - name: Fetch arms
        run: git fetch origin perf/peerid-multihash perf/identity-peerid perf/reqresp-write
      - name: Build arms
        shell: bash
        run: |
          set -euo pipefail
          build() {
            git worktree add --detach "$RUNNER_TEMP/$1" "$2"
            dotnet build "$RUNNER_TEMP/$1/libp2p/Libp2p.Core.Benchmarks/Libp2p.Core.Benchmarks.csproj" -c Release --nologo -v q
          }
          build peerid-a b14af0013ef2aca942069c82c907730be92aea4c
          build peerid-b 8dc49161ad5851669e8edfb9613c00c095f5014c
          build identity-a 862c9b71a551edf9fe1b18c231b29aa087489cdb
          build identity-b a6a762776500dccdc294503677fbe8ee0725fd13
          build reqresp-a 8d0583e73b24d3047c83e3d3deed9ed548c59e23
          build reqresp-b 78ac20744fd5ed55115aedfa48eab5ac87c7d8f3
      - name: Run interleaved
        shell: bash
        run: |
          set -euo pipefail
          run() {
            out="$RUNNER_TEMP/results/$1-$3"
            mkdir -p "$out"
            echo "=== $1 $3 load: $(cat /proc/loadavg)"
            (cd "$RUNNER_TEMP/$1/libp2p/Libp2p.Core.Benchmarks" && dotnet run -c Release --no-build -- --filter "$2" --inProcess --artifacts "$out") | grep -E '^\| |^BenchmarkDotNet|^  \[Host\]|^[A-Z].*CPU'
          }
          for round in 1 2 3; do
            run peerid-a '*MultiaddressBenchmarks*' "A$round"; run peerid-b '*MultiaddressBenchmarks*' "B$round"
            run identity-a '*IdentityPeerIdBenchmarks*' "A$round"; run identity-b '*IdentityPeerIdBenchmarks*' "B$round"
            run reqresp-a '*RequestResponseWriteBenchmarks*' "A$round"; run reqresp-b '*RequestResponseWriteBenchmarks*' "B$round"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-core-identity
          path: ${{ runner.temp }}/results
