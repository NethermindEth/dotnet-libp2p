name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # Built explicitly rather than letting CodeQL detect the build: global.json pins the
      # SDK, and the solution is restored with the repository's own nuget.config, as in test.yml.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Libp2p.slnx -p:RestoreConfigFile="$PWD/nuget.config"
          dotnet build Libp2p.slnx -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
