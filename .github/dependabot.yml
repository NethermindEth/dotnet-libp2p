version: 2
updates:

  # Both directories hold solution entry points: Libp2p.slnx at the root, Samples.slnx and
  # Tests.slnx under solutions/. Discovery expands each one's projects, so listing the root
  # alone would miss the projects only those two solutions reference.
  - package-ecosystem: nuget
    directories:
      - /
      - /solutions
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Google.Protobuf.Tools shares the $(ProtobufVersion) property with Google.Protobuf, so
      # grouping by dependency name would raise a second pull request making the same edit.
      # Routine bumps arrive through Google.Protobuf.
      - dependency-name: Google.Protobuf.Tools
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      nuget:
        # Both directories resolve versions from the same root Directory.Packages.props, so a
        # dependency they share would otherwise get one pull request per directory, each editing
        # the same line. Grouping by dependency name gives one pull request per dependency instead.
        group-by: dependency-name
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
